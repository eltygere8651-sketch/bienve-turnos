
<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#111827">
    <link rel="manifest" href="/manifest.json">
    <title>Bienve App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      ::-webkit-scrollbar { width: 8px; }
      ::-webkit-scrollbar-track { background: #1f2937; }
      ::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 4px; }
      ::-webkit-scrollbar-thumb:hover { background: #6b7280; }
      @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
      @keyframes fadeInScaleUp { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
      .animate-fade-in { animation: fadeIn 0.2s ease-out forwards; }
      .animate-fade-in-scale-up { animation: fadeInScaleUp 0.2s ease-out forwards; }
      body { -webkit-tap-highlight-color: transparent; }
    </style>
<script type="importmap">
{
  "imports": {
    "vite": "https://aistudiocdn.com/vite@^7.1.12",
    "jspdf": "https://aistudiocdn.com/jspdf@^3.0.3",
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "@vitejs/plugin-react": "https://aistudiocdn.com/@vitejs/plugin-react@^5.1.0",
    "webworker": "https://aistudiocdn.com/webworker@^0.8.4",
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.28.0"
  }
}
</script>
</head>
  <body class="bg-gray-900 text-gray-100 overscroll-none">
    <div id="root"></div>
    <script type="module" src="./index.tsx"></script>
    <script>
      // Registro de Service Worker optimizado para evitar problemas de origen cruzado
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          // Usamos una ruta relativa sin el slash inicial para mantenernos en el mismo origen/subdominio
          navigator.serviceWorker.register('service-worker.ts', { scope: './' })
            .then(reg => console.log('SW registrado en el subdominio:', reg.scope))
            .catch(err => {
              console.warn('Registro de SW omitido (entorno de desarrollo o restricción de origen):', err.message);
            });
        });
      }
    </script>
  </body>
</html>
